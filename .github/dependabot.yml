version: 2
updates:
  # npm workspaces share the root package-lock.json, so Dependabot must run from
  # the root; per-workspace directories bump package.json without the lockfile
  # and break `npm ci`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      typeorm:
        patterns:
          - typeorm
          - pg
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      playwright:
        patterns:
          - "@playwright/*"
          - playwright
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # There is no Dockerfile; the images live in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
